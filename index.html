<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>apps</title>
<meta name="theme-color" content="#f4ead8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b241d; --paper:#f4ead8; --card:#fffaf0; --muted:#7d6e58; --hair:#ddcdb2;
  --chore:#d1622a; --work:#4f6d7a; --hobby:#7a8c46; --self:#a63d2f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Rubik',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; min-height:100dvh;
}
.screen{ width:100%; max-width:430px; padding:28px 20px 40px; }
.rule{display:flex; gap:4px; margin-bottom:12px}
.rule span{flex:1; height:6px; border-radius:3px}
h1{font-size:30px; font-weight:800; line-height:1; letter-spacing:-.03em; margin:0}
.sub{font-size:13px; color:var(--muted); margin:8px 0 24px}
a.app-card{
  display:block; padding:18px; margin-bottom:12px;
  border:1px solid var(--ink); border-radius:22px; background:var(--card);
  text-decoration:none; color:var(--ink);
}
a.app-card .name{font-size:17px; font-weight:700}
a.app-card .desc{font-size:13px; color:var(--muted); margin-top:4px}
</style>
</head>
<body>
<main class="screen">
  <div class="rule">
    <span style="background:var(--chore)"></span>
    <span style="background:var(--work)"></span>
    <span style="background:var(--hobby)"></span>
    <span style="background:var(--self)"></span>
  </div>
  <h1>apps</h1>
  <p class="sub">Small things, live here.</p>

  <a class="app-card" href="/how-long/">
    <div class="name">how long does it take?</div>
    <div class="desc">A gentle time tracker &mdash; start, stop, tally, log.</div>
  </a>
</main>
</body>
</html>
