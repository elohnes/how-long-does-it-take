<style><style>
  :root{
    --paper: #f1f0f6;
    --surface: #fcfbfe;
    --ink: #3c3b45;
    --ink-soft: #8b899a;
    --border: #e2dfec;
    --primary: #7c86b0;
    --primary-ink: #fbfbfe;

    --c-chore: #c99a6a;
    --c-selfcare: #c98aa0;
    --c-work: #6f93b8;
    --c-hobby: #7ba885;
    --c-social: #9a8ac2;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  header{
    margin-bottom: 22px;
  }

  header h1{
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 23px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p{
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .running-block{
    margin-top: 16px;
  }

  .running-empty{
    font-size: 13px;
    color: var(--ink-soft);
  }

  .running-count{
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .running-row{
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--tag-color, var(--border));
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 8px;
  }

  .running-row-top{
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .running-clock{
    font-family: 'Nunito', sans-serif;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 25px;
    color: var(--tag-color, var(--primary));
    letter-spacing: -0.01em;
  }

  .running-task{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .running-task.untitled{ font-style: italic; font-weight: 400; color: var(--ink-soft); }

  .running-row-bottom{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .running-tag{
    flex-shrink: 0;
  }

  .running-started{
    flex: 1;
  }

  .stop-mini-btn{
    flex-shrink: 0;
    border: none;
    background: #c98a8a;
    color: var(--primary-ink);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 24px;
    margin-bottom: 18px;
  }

  input[type="text"]{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 12px;
  }

  input[type="text"]:disabled{
    opacity: 0.6;
  }

  input[type="text"]::placeholder{ color: #b3b1c0; }

  input[type="text"]:focus, .tag-pill:focus-visible, .go-btn:focus-visible{
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .tag-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .tag-pill{
    border: 1.5px solid var(--tag-color, var(--border));
    background: var(--surface);
    color: var(--tag-color, var(--ink));
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .tag-pill.selected{
    background: var(--tag-color, var(--primary));
    color: var(--primary-ink);
  }

  .tag-pill:disabled{
    cursor: default;
    opacity: 0.55;
  }

  .go-btn{
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: var(--primary);
    color: var(--primary-ink);
  }

  .go-btn:disabled{
    background: #e2dfec;
    color: #a8a6b8;
    cursor: not-allowed;
  }

  .hint{
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
    min-height: 16px;
  }

  .link-btn{
    background: none;
    border: none;
    padding: 2px 4px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .start-edit-panel{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .start-edit-panel input[type="datetime-local"]{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
  }

  .manual-toggle-row{
    text-align: center;
    margin-top: 6px;
  }

  .manual-panel{
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .manual-panel.open{ display: block; }

  .manual-panel .field-label{
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .time-field-row{
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .time-field{
    flex: 1;
    min-width: 0;
  }

  .time-field label{
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .time-field input[type="datetime-local"]{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
  }

  .manual-panel .go-btn{ margin-top: 4px; }

  .manual-error{
    text-align: center;
    font-size: 12px;
    color: #b47a7a;
    margin-top: 8px;
    min-height: 16px;
  }

  /* Tally */
  .section-label{
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: none;
    margin: 0 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .range-toggle{
    display: flex;
    gap: 4px;
  }

  .range-toggle button{
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    cursor: pointer;
  }

  .range-toggle button.active{
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }

  .tally-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .tally-row{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--tag-color);
    flex-shrink: 0;
  }

  .tally-name{
    flex-shrink: 0;
    width: 78px;
    color: var(--ink);
    font-weight: 500;
  }

  .tally-bar-track{
    flex: 1;
    height: 7px;
    background: var(--paper);
    border-radius: 4px;
    overflow: hidden;
  }

  .tally-bar-fill{
    height: 100%;
    background: var(--tag-color);
    border-radius: 4px;
  }

  .tally-time{
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    font-size: 13px;
    width: 52px;
    text-align: right;
  }

  .tally-empty{
    color: var(--ink-soft);
    font-size: 13px;
  }

  .tally-total{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .tally-total b{
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* Log */
  .log-date-heading{
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 20px 0 8px;
    padding-left: 2px;
  }

  .log-date-heading:first-child{ margin-top: 0; }

  .log-entry{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
  }

  .log-entry:last-child{ border-bottom: none; }

  .log-entry .dot{ margin-top: 6px; }

  .log-main{ flex: 1; min-width: 0; }

  .log-task{
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    word-break: break-word;
  }

  .log-task.untitled{ color: var(--ink-soft); font-style: italic; font-weight: 400; }

  .log-meta{
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .log-duration{
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }

  .empty-state{
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 20px 10px;
  }

  .storage-note{
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
</style>
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>how long does it take?</h1>
    <p>One gentle place to see where your time went.</p>
    <div class="running-block" id="runningBlock"></div>
  </header>

  <div class="card">
    <input type="text" id="taskInput" placeholder="what are you doing?" maxlength="120">

    <div class="tag-row" id="tagRow"></div>

    <button class="go-btn" id="goBtn">Start</button>
    <div class="hint" id="hint"></div>

    <div class="manual-toggle-row" id="manualToggleRow">
      <button type="button" class="link-btn" id="manualToggle">Missed it? Log a past entry</button>
    </div>

    <div class="manual-panel" id="manualPanel">
      <div class="field-label">Log a past entry</div>
      <input type="text" id="manualTask" placeholder="what did you do?" maxlength="120">
      <div class="tag-row" id="manualTagRow"></div>
      <div class="time-field-row">
        <div class="time-field">
          <label for="manualStart">Start</label>
          <input type="datetime-local" id="manualStart">
        </div>
        <div class="time-field">
          <label for="manualEnd">End</label>
          <input type="datetime-local" id="manualEnd">
        </div>
      </div>
      <button type="button" class="go-btn" id="manualSaveBtn">Log entry</button>
      <div class="manual-error" id="manualError"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">
      <span>Tally</span>
      <div class="range-toggle" id="rangeToggle">
        <button data-range="today" class="active">Today</button>
        <button data-range="week">This week</button>
        <button data-range="all">All time</button>
      </div>
    </div>
    <div class="tally-list" id="tallyList"></div>
    <div class="tally-total" id="tallyTotal" style="display:none;"></div>
  </div>

  <div class="card" id="logCard">
    <div class="section-label"><span>Log</span></div>
    <div id="logList"></div>
  </div>

</div>

<script>
(function(){
  const TAGS = [
    { id: 'chore', label: 'Chore', color: 'var(--c-chore)' },
    { id: 'selfcare', label: 'Self-care', color: 'var(--c-selfcare)' },
    { id: 'work', label: 'Work', color: 'var(--c-work)' },
    { id: 'hobby', label: 'Hobby', color: 'var(--c-hobby)' },
    { id: 'social', label: 'Social', color: 'var(--c-social)' },
  ];
  const TAG_MAP = Object.fromEntries(TAGS.map(t => [t.id, t]));
  const ENTRIES_KEY = 'hldit-entries';
  const ACTIVE_KEY = 'hldit-active';

  let entries = [];       // {id, task, tag, startISO, endISO, durationMs}
  let activeTimers = [];  // [{id, task, tag, startISO}, ...] — multiple can run at once
  let selectedTag = null; // for the next timer you're about to start
  let tickHandle = null;
  let currentRange = 'today';
  let storageOK = true;
  let openEditId = null;  // id of the running timer whose start-time editor is open

  const el = {
    runningBlock: document.getElementById('runningBlock'),
    taskInput: document.getElementById('taskInput'),
    tagRow: document.getElementById('tagRow'),
    goBtn: document.getElementById('goBtn'),
    hint: document.getElementById('hint'),
    tallyList: document.getElementById('tallyList'),
    tallyTotal: document.getElementById('tallyTotal'),
    logList: document.getElementById('logList'),
    rangeToggle: document.getElementById('rangeToggle'),
    manualToggle: document.getElementById('manualToggle'),
    manualPanel: document.getElementById('manualPanel'),
    manualTask: document.getElementById('manualTask'),
    manualTagRow: document.getElementById('manualTagRow'),
    manualStart: document.getElementById('manualStart'),
    manualEnd: document.getElementById('manualEnd'),
    manualSaveBtn: document.getElementById('manualSaveBtn'),
    manualError: document.getElementById('manualError'),
  };

  let manualSelectedTag = null;

  // ---------- storage ----------
  // Inside Claude's artifact viewer, window.storage is provided and preferred.
  // Once this is saved to your Home Screen and running as its own app, that
  // API isn't there — so it falls back to the browser's own local storage,
  // which is what actually keeps your entries on your phone between opens.
  const hasClaudeStorage = typeof window.storage !== 'undefined';

  async function storageGet(key){
    if(hasClaudeStorage){
      try{ return await window.storage.get(key, false); }
      catch(err){ return null; }
    }
    try{
      const v = localStorage.getItem(key);
      return v === null ? null : { value: v };
    }catch(err){ return null; }
  }

  async function storageSet(key, value){
    if(hasClaudeStorage){
      try{ return await window.storage.set(key, value, false); }
      catch(err){ return null; }
    }
    try{ localStorage.setItem(key, value); return { value }; }
    catch(err){ return null; }
  }

  async function storageDelete(key){
    if(hasClaudeStorage){
      try{ return await window.storage.delete(key, false); }
      catch(err){ return null; }
    }
    try{ localStorage.removeItem(key); return { deleted: true }; }
    catch(err){ return null; }
  }

  async function loadAll(){
    try{
      const e = await storageGet(ENTRIES_KEY);
      entries = e ? JSON.parse(e.value) : [];
    }catch(err){ entries = []; }
    try{
      const a = await storageGet(ACTIVE_KEY);
      const parsed = a ? JSON.parse(a.value) : [];
      if(Array.isArray(parsed)){
        activeTimers = parsed;
      }else if(parsed && parsed.startISO){
        // migrate old single-timer format into the list
        activeTimers = [{ id: uid(), task: parsed.task || '', tag: parsed.tag, startISO: parsed.startISO }];
      }else{
        activeTimers = [];
      }
    }catch(err){ activeTimers = []; }
  }

  async function saveEntries(){
    const res = await storageSet(ENTRIES_KEY, JSON.stringify(entries));
    if(!res) storageOK = false;
  }

  async function saveActiveTimers(){
    if(activeTimers.length === 0){
      await storageDelete(ACTIVE_KEY);
    }else{
      await storageSet(ACTIVE_KEY, JSON.stringify(activeTimers));
    }
  }

  // ---------- helpers ----------
  function pad(n){ return String(n).padStart(2,'0'); }

  function fmtClock(ms){
    const totalSec = Math.max(0, Math.floor(ms/1000));
    const m = Math.floor(totalSec/60);
    const s = totalSec%60;
    return `${pad(m)}:${pad(s)}`;
  }

  function fmtHuman(ms){
    const totalSec = Math.max(0, Math.round(ms/1000));
    if(totalSec < 60) return `${totalSec}s`;
    const totalMin = Math.round(totalSec/60);
    const h = Math.floor(totalMin/60);
    const m = totalMin%60;
    if(h === 0) return `${m}m`;
    if(m === 0) return `${h}h`;
    return `${h}h ${m}m`;
  }

  function fmtTimeOfDay(iso){
    const d = new Date(iso);
    let h = d.getHours();
    const m = pad(d.getMinutes());
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if(h === 0) h = 12;
    return `${h}:${m}${ampm}`;
  }

  function fmtDateHeading(dateKey){
    const today = dateKeyOf(new Date());
    const yestDate = new Date(); yestDate.setDate(yestDate.getDate()-1);
    const yest = dateKeyOf(yestDate);
    if(dateKey === today) return 'Today';
    if(dateKey === yest) return 'Yesterday';
    const [y,mo,da] = dateKey.split('-').map(Number);
    const d = new Date(y, mo-1, da);
    return d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }

  function dateKeyOf(d){
    const dt = new Date(d);
    return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  }

  function startOfWeek(d){
    const dt = new Date(d);
    const day = dt.getDay(); // 0 = Sunday
    dt.setHours(0,0,0,0);
    dt.setDate(dt.getDate() - day);
    return dt;
  }

  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function toLocalInputValue(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fromLocalInputValue(val){
    // datetime-local values are parsed as local time by the Date constructor
    const d = new Date(val);
    return isNaN(d.getTime()) ? null : d.toISOString();
  }

  // ---------- render: tag pills (shared by main + manual panel) ----------
  function renderTagPills(container, selected, disabled, onSelect){
    container.innerHTML = '';
    TAGS.forEach(tag => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tag-pill' + (selected === tag.id ? ' selected' : '');
      btn.style.setProperty('--tag-color', tag.color);
      btn.textContent = tag.label;
      btn.disabled = !!disabled;
      btn.addEventListener('click', () => {
        if(disabled) return;
        onSelect(tag.id);
      });
      container.appendChild(btn);
    });
  }

  function renderTagRow(){
    renderTagPills(el.tagRow, selectedTag, false, (id) => {
      selectedTag = id;
      renderTagRow();
      renderGoState();
    });
  }

  function renderManualTagRow(){
    renderTagPills(el.manualTagRow, manualSelectedTag, false, (id) => {
      manualSelectedTag = id;
      renderManualTagRow();
    });
  }

  // ---------- render: start controls ----------
  function renderGoState(){
    el.goBtn.textContent = activeTimers.length > 0 ? 'Start another' : 'Start';
    el.goBtn.disabled = !selectedTag;
    el.hint.textContent = selectedTag ? '' : 'Pick a tag to start.';
  }

  // ---------- render: running timers (header) ----------
  function renderRunningBlock(){
    if(activeTimers.length === 0){
      el.runningBlock.innerHTML = '<div class="running-empty">Nothing running right now.</div>';
      return;
    }

    const sorted = [...activeTimers].sort((a,b) => new Date(a.startISO) - new Date(b.startISO));
    const countLabel = activeTimers.length === 1 ? '1 timer running' : `${activeTimers.length} timers running at once`;

    let html = `<div class="running-count">${countLabel}</div>`;

    sorted.forEach(t => {
      const tag = TAG_MAP[t.tag];
      const elapsed = Date.now() - new Date(t.startISO).getTime();
      const taskText = t.task && t.task.trim() ? escapeHtml(t.task.trim()) : 'Untitled';
      const taskClass = t.task && t.task.trim() ? 'running-task' : 'running-task untitled';
      const editOpen = openEditId === t.id;

      html += `
        <div class="running-row" style="--tag-color:${tag.color}" data-id="${t.id}">
          <div class="running-row-top">
            <span class="running-clock" data-role="clock" data-id="${t.id}" data-start="${t.startISO}">${fmtClock(elapsed)}</span>
            <span class="${taskClass}">${taskText}</span>
          </div>
          <div class="running-row-bottom">
            <span class="running-tag">${tag.label}</span>
            <span class="running-started">started ${fmtTimeOfDay(t.startISO)}</span>
            <button type="button" class="link-btn" data-action="toggleEdit" data-id="${t.id}">edit start</button>
            <button type="button" class="stop-mini-btn" data-action="stop" data-id="${t.id}">Stop</button>
          </div>
          ${editOpen ? `
          <div class="start-edit-panel">
            <input type="datetime-local" data-role="editInput" data-id="${t.id}" value="${toLocalInputValue(t.startISO)}">
            <button type="button" class="link-btn" data-action="saveEdit" data-id="${t.id}">Save</button>
          </div>` : ''}
        </div>
      `;
    });

    el.runningBlock.innerHTML = html;
  }

  function tickClocks(){
    if(activeTimers.length === 0) return;
    const clocks = el.runningBlock.querySelectorAll('[data-role="clock"]');
    clocks.forEach(node => {
      const startISO = node.dataset.start;
      const elapsed = Date.now() - new Date(startISO).getTime();
      node.textContent = fmtClock(elapsed);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(tickClocks, 1000);
  }
  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  // ---------- render: tally ----------
  function entriesInRange(range){
    const now = new Date();
    if(range === 'all') return entries;
    if(range === 'today'){
      const key = dateKeyOf(now);
      return entries.filter(e => dateKeyOf(e.startISO) === key);
    }
    if(range === 'week'){
      const wkStart = startOfWeek(now).getTime();
      return entries.filter(e => new Date(e.startISO).getTime() >= wkStart);
    }
    return entries;
  }

  function renderTally(){
    const rows = entriesInRange(currentRange);
    const totals = {};
    TAGS.forEach(t => totals[t.id] = 0);
    let grandTotal = 0;
    rows.forEach(e => {
      totals[e.tag] = (totals[e.tag] || 0) + e.durationMs;
      grandTotal += e.durationMs;
    });

    el.tallyList.innerHTML = '';
    if(grandTotal === 0){
      el.tallyList.innerHTML = '<div class="tally-empty">Nothing logged yet for this range.</div>';
      el.tallyTotal.style.display = 'none';
      return;
    }

    const maxVal = Math.max(...TAGS.map(t => totals[t.id]));
    TAGS.forEach(tag => {
      const val = totals[tag.id];
      if(val <= 0) return;
      const row = document.createElement('div');
      row.className = 'tally-row';
      const pct = maxVal > 0 ? Math.max(4, Math.round((val/maxVal)*100)) : 0;
      row.innerHTML = `
        <span class="dot" style="--tag-color:${tag.color}"></span>
        <span class="tally-name">${tag.label}</span>
        <span class="tally-bar-track"><span class="tally-bar-fill" style="--tag-color:${tag.color}; width:${pct}%"></span></span>
        <span class="tally-time">${fmtHuman(val)}</span>
      `;
      el.tallyList.appendChild(row);
    });

    el.tallyTotal.style.display = 'flex';
    el.tallyTotal.innerHTML = `<span>Total</span><b>${fmtHuman(grandTotal)}</b>`;
  }

  // ---------- render: log ----------
  function renderLog(){
    if(entries.length === 0){
      el.logList.innerHTML = '<div class="empty-state">No entries yet. Start the timer above to log your first one.</div>';
      return;
    }
    const sorted = [...entries].sort((a,b) => new Date(b.startISO) - new Date(a.startISO));
    const groups = [];
    let lastKey = null;
    sorted.forEach(e => {
      const key = dateKeyOf(e.startISO);
      if(key !== lastKey){
        groups.push({ key, items: [] });
        lastKey = key;
      }
      groups[groups.length-1].items.push(e);
    });

    el.logList.innerHTML = '';
    groups.forEach(g => {
      const heading = document.createElement('div');
      heading.className = 'log-date-heading';
      heading.textContent = fmtDateHeading(g.key);
      el.logList.appendChild(heading);

      g.items.forEach(e => {
        const tag = TAG_MAP[e.tag] || TAGS[0];
        const row = document.createElement('div');
        row.className = 'log-entry';
        const taskText = e.task && e.task.trim() ? escapeHtml(e.task.trim()) : 'Untitled';
        const taskClass = e.task && e.task.trim() ? 'log-task' : 'log-task untitled';
        row.innerHTML = `
          <span class="dot" style="--tag-color:${tag.color}"></span>
          <div class="log-main">
            <div class="${taskClass}">${taskText}</div>
            <div class="log-meta">${tag.label} &middot; ${fmtTimeOfDay(e.startISO)}&ndash;${fmtTimeOfDay(e.endISO)}</div>
          </div>
          <div class="log-duration">${fmtHuman(e.durationMs)}</div>
        `;
        el.logList.appendChild(row);
      });
    });
  }

  function renderAll(){
    renderTagRow();
    renderManualTagRow();
    renderGoState();
    renderRunningBlock();
    renderTally();
    renderLog();
  }

  // ---------- actions ----------
  async function handleGo(){
    if(!selectedTag) return;
    activeTimers.push({
      id: uid(),
      task: el.taskInput.value || '',
      tag: selectedTag,
      startISO: new Date().toISOString(),
    });
    el.taskInput.value = '';
    selectedTag = null;
    await saveActiveTimers();
    startTicking();
    renderAll();
  }

  async function stopTimer(id){
    const idx = activeTimers.findIndex(t => t.id === id);
    if(idx === -1) return;
    const t = activeTimers[idx];
    const endISO = new Date().toISOString();
    const durationMs = Date.now() - new Date(t.startISO).getTime();
    entries.push({
      id: uid(),
      task: t.task || '',
      tag: t.tag,
      startISO: t.startISO,
      endISO,
      durationMs: Math.max(0, durationMs),
    });
    activeTimers.splice(idx, 1);
    if(openEditId === id) openEditId = null;
    if(activeTimers.length === 0) stopTicking();
    await saveEntries();
    await saveActiveTimers();
    renderAll();
  }

  el.goBtn.addEventListener('click', handleGo);

  el.runningBlock.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-action]');
    if(!btn) return;
    const { action, id } = btn.dataset;

    if(action === 'stop'){
      await stopTimer(id);
      return;
    }

    if(action === 'toggleEdit'){
      openEditId = (openEditId === id) ? null : id;
      renderRunningBlock();
      return;
    }

    if(action === 'saveEdit'){
      const input = el.runningBlock.querySelector(`input[data-role="editInput"][data-id="${id}"]`);
      if(!input) return;
      const iso = fromLocalInputValue(input.value);
      if(!iso) return;
      if(new Date(iso).getTime() > Date.now()) return; // no future start times
      const t = activeTimers.find(x => x.id === id);
      if(t){
        t.startISO = iso;
        await saveActiveTimers();
      }
      openEditId = null;
      renderRunningBlock();
    }
  });

  el.rangeToggle.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-range]');
    if(!btn) return;
    currentRange = btn.dataset.range;
    [...el.rangeToggle.children].forEach(b => b.classList.toggle('active', b === btn));
    renderTally();
  });

  // ---- manual past entry ----
  function resetManualForm(){
    const now = new Date();
    const halfHourAgo = new Date(now.getTime() - 30*60000);
    el.manualTask.value = '';
    manualSelectedTag = null;
    el.manualStart.value = toLocalInputValue(halfHourAgo);
    el.manualEnd.value = toLocalInputValue(now);
    el.manualError.textContent = '';
    renderManualTagRow();
  }

  el.manualToggle.addEventListener('click', () => {
    const isOpen = el.manualPanel.classList.contains('open');
    if(isOpen){
      el.manualPanel.classList.remove('open');
      el.manualToggle.textContent = 'Missed it? Log a past entry';
    }else{
      resetManualForm();
      el.manualPanel.classList.add('open');
      el.manualToggle.textContent = 'Cancel past entry';
    }
  });

  el.manualSaveBtn.addEventListener('click', async () => {
    el.manualError.textContent = '';
    if(!manualSelectedTag){
      el.manualError.textContent = 'Pick a tag.';
      return;
    }
    const startISO = fromLocalInputValue(el.manualStart.value);
    const endISO = fromLocalInputValue(el.manualEnd.value);
    if(!startISO || !endISO){
      el.manualError.textContent = 'Add a start and end time.';
      return;
    }
    const durationMs = new Date(endISO).getTime() - new Date(startISO).getTime();
    if(durationMs <= 0){
      el.manualError.textContent = 'End time has to be after the start time.';
      return;
    }
    entries.push({
      id: uid(),
      task: el.manualTask.value || '',
      tag: manualSelectedTag,
      startISO,
      endISO,
      durationMs,
    });
    await saveEntries();
    el.manualPanel.classList.remove('open');
    el.manualToggle.textContent = 'Missed it? Log a past entry';
    renderAll();
  });

  // ---------- init ----------
  (async function init(){
    await loadAll();
    if(activeTimers.length > 0){
      startTicking();
    }
    renderAll();
    if(!storageOK){
      const note = document.createElement('div');
      note.className = 'storage-note';
      note.textContent = "Entries aren't saving right now — they'll only last this session.";
      document.querySelector('.app').appendChild(note);
    }
  })();
})();
</script>
</body>
</html>
