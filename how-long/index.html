<style>
:root{
  --ink:#2b241d; --paper:#f4ead8; --card:#fffaf0; --muted:#7d6e58; --faint:#a1907a;
  --rule:#e3d6bf; --hair:#ddcdb2; --pill:#d5c4a8;
  --chore:#d1622a; --work:#4f6d7a; --hobby:#7a8c46; --social:#8a6ba3; --self:#a63d2f; --amber:#d9a13b;
  --danger:#a63d2f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Rubik',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; min-height:100dvh;
}
.screen{
  width:100%; max-width:430px; background:var(--paper);
  display:flex; flex-direction:column; min-height:100dvh;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
header{padding:20px 20px 16px}
.rule{display:flex; gap:4px; margin-bottom:12px}
.rule span{flex:1; height:6px; border-radius:3px}
h1{font-size:34px; font-weight:800; line-height:.95; letter-spacing:-.03em; margin:0}
.sub{font-size:13px; color:var(--muted); margin-top:8px}

.panel{margin:0 16px 16px; padding:18px; border:1px solid var(--ink); border-radius:22px; background:var(--card)}

/* running */
.running-count{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px}
.run-row + .run-row{margin-top:12px; padding-top:12px; border-top:1px dashed var(--hair)}
.clockrow{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.clock{font-size:44px; font-weight:800; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; color:var(--tag-color,var(--chore))}
.tagnow{font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px; background:var(--tag-color,var(--amber)); color:var(--paper); white-space:nowrap}
.task{font-size:16px; font-weight:700; margin-top:8px}
.task.untitled{font-weight:500; font-style:italic; color:var(--muted)}
.since-row{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:6px}
.since{font-size:12px; color:var(--muted)}
.link-btn{background:none; border:none; padding:0; font:700 12px 'Rubik',sans-serif; color:var(--work); cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.stop-btn{margin-left:auto; border:1px solid var(--danger); background:var(--danger); color:var(--card); font:700 12px 'Rubik',sans-serif; padding:6px 13px; border-radius:999px; cursor:pointer}
.idle-h{font-size:22px; font-weight:800; letter-spacing:-.02em; color:var(--faint)}
.idle-p{font-size:13px; color:var(--muted); margin-top:6px}
.edit-panel{display:flex; align-items:center; gap:8px; margin-top:10px}
.edit-panel input[type="datetime-local"]{font:13px 'Rubik',sans-serif; padding:8px 9px; border:1px solid var(--hair); border-radius:12px; background:#fdf7ea; color:var(--ink)}

/* entry */
.input{width:100%; padding:14px 16px; border:1px solid var(--hair); border-radius:18px; background:#fdf7ea;
  font:15px 'Rubik',sans-serif; color:var(--ink); margin-bottom:12px}
.input::placeholder{color:var(--faint)}
.input:focus, .tag:focus-visible, .go:focus-visible{outline:2px solid var(--work); outline-offset:2px}
.tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.tag{padding:8px 14px; border-radius:999px; border:1.5px solid var(--tag-color,var(--pill)); color:var(--tag-color,var(--ink));
  background:none; font:700 13px 'Rubik',sans-serif; cursor:pointer; transition:background .12s,color .12s}
.tag.selected{background:var(--tag-color); color:var(--paper)}
.tag:disabled{cursor:default; opacity:.5}
.go{width:100%; padding:15px; border:1px solid var(--ink); border-radius:999px;
  background:var(--ink); color:var(--paper); font:700 15px 'Rubik',sans-serif; cursor:pointer;
  transition:background .15s,border-color .15s,color .15s}
.go:hover{background:var(--chore); border-color:var(--chore)}
.go:disabled{background:var(--pill); border-color:var(--pill); color:#8a7c62; cursor:not-allowed}
.hint{text-align:center; font-size:12px; color:var(--muted); margin-top:10px; min-height:16px}
.add-tag-row{margin:-6px 0 16px}
.add-tag-panel{display:none; margin-top:10px}
.add-tag-panel.open{display:block}
.add-tag-panel .input{margin-bottom:10px}
.add-tag-panel .go{padding:12px}
.manual-toggle-row{text-align:center; margin-top:4px}
.manual-panel{margin-top:16px; padding-top:16px; border-top:1px dashed var(--hair); display:none}
.manual-panel.open{display:block}
.field-label{font-size:12px; font-weight:700; color:var(--muted); margin:0 0 8px}
.time-field-row{display:flex; gap:10px; margin-bottom:12px}
.time-field{flex:1; min-width:0}
.time-field label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
.time-field input[type="datetime-local"]{width:100%; font:13px 'Rubik',sans-serif; padding:10px; border:1px solid var(--hair); border-radius:14px; background:#fdf7ea; color:var(--ink)}
.manual-error{text-align:center; font-size:12px; color:var(--danger); margin-top:8px; min-height:16px}

/* tally */
.tally-hd{display:flex; justify-content:space-between; align-items:center}
.tally-hd h2{font-size:15px; font-weight:800; letter-spacing:-.01em; margin:0}
.periods{display:flex; gap:5px}
.period{padding:4px 10px; border-radius:999px; border:1px solid var(--pill); background:none;
  font:700 11px 'Rubik',sans-serif; color:var(--muted); cursor:pointer}
.period.active{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chart{display:flex; gap:8px; margin-top:16px; align-items:flex-end; min-height:80px}
.col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px}
.bar{width:100%; border-radius:8px 8px 0 0; border:1px solid var(--ink); border-bottom:none; background:var(--tag-color)}
.col span{font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase}
.baseline{height:1px; background:var(--ink); margin-top:2px}
.total{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:10px}
.total b{color:var(--ink)}
.tally-empty{color:var(--muted); font-size:13px; text-align:center; padding:10px 0}

/* log */
.log-date-heading{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px}
.log-date-heading:first-child{margin-top:0}
.log-hint{font-size:11px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--faint)}
.row{display:flex; gap:10px; align-items:baseline; padding:11px 2px; border-bottom:1px solid var(--rule); font-size:14px; cursor:pointer; border-radius:10px}
.row:hover{background:rgba(43,36,29,.04)}
.row:last-child{border-bottom:none}
.row .dot{width:8px; height:8px; border-radius:50%; background:var(--tag-color); flex-shrink:0; align-self:center}
.row .t{color:var(--faint); width:58px; font-size:11px; font-weight:500; flex-shrink:0}
.row .n{flex:1; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .n.untitled{color:var(--muted); font-style:italic; font-weight:400}
.row .d{font-weight:700; flex-shrink:0}
.empty-state{text-align:center; color:var(--muted); font-size:13px; padding:14px 0}
.log-edit-panel{margin:2px 0 12px; padding:14px; border:1px solid var(--hair); border-radius:16px; background:#fdf7ea}
.log-edit-panel .input{margin-bottom:10px}
.log-edit-panel .tags{margin-bottom:14px}
.log-edit-actions{display:flex; align-items:center; gap:16px; margin-top:2px}
.log-edit-actions .go{flex:1; padding:12px}
.danger-link{color:var(--danger)}
.storage-note{text-align:center; font-size:11px; color:var(--muted); margin:0 20px 16px}
</style>
</head>
<body>
<main class="screen">

  <header>
    <div class="rule">
      <span style="background:var(--chore)"></span>
      <span style="background:var(--amber)"></span>
      <span style="background:var(--hobby)"></span>
      <span style="background:var(--self)"></span>
    </div>
    <h1>how long<br>does it take?</h1>
    <p class="sub">A place to see where the day went.</p>
  </header>

  <section class="panel" id="runningPanel"></section>

  <section class="panel">
    <input type="text" class="input" id="taskInput" placeholder="what are you doing?" maxlength="120">
    <div class="tags" id="tagRow"></div>

    <div class="add-tag-row">
      <button type="button" class="link-btn" id="addTagToggle">+ Add a tag</button>
      <div class="add-tag-panel" id="addTagPanel">
        <input type="text" class="input" id="newTagName" placeholder="new tag name" maxlength="24">
        <button type="button" class="go" id="addTagSaveBtn">Add tag</button>
        <div class="manual-error" id="addTagError"></div>
      </div>
    </div>

    <button class="go" id="goBtn">Start</button>
    <div class="hint" id="hint"></div>

    <div class="manual-toggle-row">
      <button type="button" class="link-btn" id="manualToggle">Missed it? Log a past entry</button>
    </div>

    <div class="manual-panel" id="manualPanel">
      <div class="field-label">Log a past entry</div>
      <input type="text" class="input" id="manualTask" placeholder="what did you do?" maxlength="120">
      <div class="tags" id="manualTagRow"></div>
      <div class="time-field-row">
        <div class="time-field">
          <label for="manualStart">Start</label>
          <input type="datetime-local" id="manualStart">
        </div>
        <div class="time-field">
          <label for="manualEnd">End</label>
          <input type="datetime-local" id="manualEnd">
        </div>
      </div>
      <button type="button" class="go" id="manualSaveBtn">Log entry</button>
      <div class="manual-error" id="manualError"></div>
    </div>
  </section>

  <section class="panel">
    <div class="tally-hd">
      <h2>Tally</h2>
      <div class="periods" id="rangeToggle">
        <button data-range="today" class="active">Day</button>
        <button data-range="week">Week</button>
        <button data-range="all">All</button>
      </div>
    </div>
    <div class="chart" id="tallyChart"></div>
    <div class="baseline" id="tallyBaseline"></div>
    <div class="total" id="tallyTotal" style="display:none;"></div>
  </section>

  <section class="panel">
    <div class="tally-hd"><h2>Log <span class="log-hint">&middot; tap an entry to edit</span></h2></div>
    <div id="logList"></div>
  </section>

</main>

<script>
(function(){
  const TAGS = [
    { id: 'chore', label: 'Chore', short: 'CHR', color: 'var(--chore)' },
    { id: 'selfcare', label: 'Self-care', short: 'SLF', color: 'var(--self)' },
    { id: 'work', label: 'Work', short: 'WRK', color: 'var(--work)' },
    { id: 'hobby', label: 'Hobby', short: 'HBY', color: 'var(--hobby)' },
    { id: 'social', label: 'Social', short: 'SOC', color: 'var(--social)' },
  ];
  const TAG_MAP = Object.fromEntries(TAGS.map(t => [t.id, t]));
  const TAG_PALETTE = ['#c97b3d','#3d7a99','#6b8f4e','#9c6bb0','#b0555a','#5a8a7a','#a68a3d','#6a6ab0'];
  const ENTRIES_KEY = 'hldit-entries';
  const ACTIVE_KEY = 'hldit-active';
  const TAGS_KEY = 'hldit-custom-tags';

  let entries = [];       // {id, task, tag, startISO, endISO, durationMs}
  let activeTimers = [];  // [{id, task, tag, startISO}, ...] — multiple can run at once
  let customTags = [];    // user-added tags, persisted separately from the 5 defaults
  let selectedTag = null; // for the next timer you're about to start
  let tickHandle = null;
  let currentRange = 'today';
  let storageOK = true;
  let openEditId = null;  // id of the running timer whose start-time editor is open
  let openLogEditId = null; // id of the log entry currently being edited
  let logEditTag = null;    // selected tag while editing a log entry

  const el = {
    runningPanel: document.getElementById('runningPanel'),
    taskInput: document.getElementById('taskInput'),
    tagRow: document.getElementById('tagRow'),
    goBtn: document.getElementById('goBtn'),
    hint: document.getElementById('hint'),
    addTagToggle: document.getElementById('addTagToggle'),
    addTagPanel: document.getElementById('addTagPanel'),
    newTagName: document.getElementById('newTagName'),
    addTagSaveBtn: document.getElementById('addTagSaveBtn'),
    addTagError: document.getElementById('addTagError'),
    tallyChart: document.getElementById('tallyChart'),
    tallyBaseline: document.getElementById('tallyBaseline'),
    tallyTotal: document.getElementById('tallyTotal'),
    logList: document.getElementById('logList'),
    rangeToggle: document.getElementById('rangeToggle'),
    manualToggle: document.getElementById('manualToggle'),
    manualPanel: document.getElementById('manualPanel'),
    manualTask: document.getElementById('manualTask'),
    manualTagRow: document.getElementById('manualTagRow'),
    manualStart: document.getElementById('manualStart'),
    manualEnd: document.getElementById('manualEnd'),
    manualSaveBtn: document.getElementById('manualSaveBtn'),
    manualError: document.getElementById('manualError'),
  };

  let manualSelectedTag = null;

  // ---------- storage ----------
  // Inside Claude's artifact viewer, window.storage is provided and preferred.
  // Once this is saved to your Home Screen (or opened as a plain hosted page)
  // that API isn't there — so it falls back to the browser's own local
  // storage, which is what actually keeps your entries around between opens.
  const hasClaudeStorage = typeof window.storage !== 'undefined';

  async function storageGet(key){
    if(hasClaudeStorage){
      try{ return await window.storage.get(key, false); }
      catch(err){ return null; }
    }
    try{
      const v = localStorage.getItem(key);
      return v === null ? null : { value: v };
    }catch(err){ return null; }
  }

  async function storageSet(key, value){
    if(hasClaudeStorage){
      try{ return await window.storage.set(key, value, false); }
      catch(err){ return null; }
    }
    try{ localStorage.setItem(key, value); return { value }; }
    catch(err){ return null; }
  }

  async function storageDelete(key){
    if(hasClaudeStorage){
      try{ return await window.storage.delete(key, false); }
      catch(err){ return null; }
    }
    try{ localStorage.removeItem(key); return { deleted: true }; }
    catch(err){ return null; }
  }

  async function loadAll(){
    try{
      const e = await storageGet(ENTRIES_KEY);
      entries = e ? JSON.parse(e.value) : [];
    }catch(err){ entries = []; }
    try{
      const a = await storageGet(ACTIVE_KEY);
      const parsed = a ? JSON.parse(a.value) : [];
      if(Array.isArray(parsed)){
        activeTimers = parsed;
      }else if(parsed && parsed.startISO){
        activeTimers = [{ id: uid(), task: parsed.task || '', tag: parsed.tag, startISO: parsed.startISO }];
      }else{
        activeTimers = [];
      }
    }catch(err){ activeTimers = []; }
    try{
      const c = await storageGet(TAGS_KEY);
      const parsed = c ? JSON.parse(c.value) : [];
      if(Array.isArray(parsed)){
        customTags = parsed;
        customTags.forEach(t => {
          if(!TAG_MAP[t.id]){ TAGS.push(t); TAG_MAP[t.id] = t; }
        });
      }
    }catch(err){ customTags = []; }
  }

  async function saveCustomTags(){
    await storageSet(TAGS_KEY, JSON.stringify(customTags));
  }

  function addTag(label){
    const trimmed = (label || '').trim();
    if(!trimmed) return null;
    const tag = {
      id: 'tag' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      label: trimmed,
      short: trimmed.slice(0,3).toUpperCase(),
      color: TAG_PALETTE[customTags.length % TAG_PALETTE.length],
    };
    TAGS.push(tag);
    TAG_MAP[tag.id] = tag;
    customTags.push(tag);
    return tag;
  }

  async function saveEntries(){
    const res = await storageSet(ENTRIES_KEY, JSON.stringify(entries));
    if(!res) storageOK = false;
  }

  async function saveActiveTimers(){
    if(activeTimers.length === 0){
      await storageDelete(ACTIVE_KEY);
    }else{
      await storageSet(ACTIVE_KEY, JSON.stringify(activeTimers));
    }
  }

  // ---------- helpers ----------
  function pad(n){ return String(n).padStart(2,'0'); }

  function fmtClock(ms){
    const totalSec = Math.max(0, Math.floor(ms/1000));
    const m = Math.floor(totalSec/60);
    const s = totalSec%60;
    return `${pad(m)}:${pad(s)}`;
  }

  function fmtHuman(ms){
    const totalSec = Math.max(0, Math.round(ms/1000));
    if(totalSec < 60) return `${totalSec}s`;
    const totalMin = Math.round(totalSec/60);
    const h = Math.floor(totalMin/60);
    const m = totalMin%60;
    if(h === 0) return `${m}m`;
    if(m === 0) return `${h}h`;
    return `${h}h ${m}m`;
  }

  function fmtTimeOfDay(iso){
    const d = new Date(iso);
    let h = d.getHours();
    const m = pad(d.getMinutes());
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if(h === 0) h = 12;
    return `${h}:${m}${ampm}`;
  }

  function fmtDateHeading(dateKey){
    const today = dateKeyOf(new Date());
    const yestDate = new Date(); yestDate.setDate(yestDate.getDate()-1);
    const yest = dateKeyOf(yestDate);
    if(dateKey === today) return 'Today';
    if(dateKey === yest) return 'Yesterday';
    const [y,mo,da] = dateKey.split('-').map(Number);
    const d = new Date(y, mo-1, da);
    return d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }

  function dateKeyOf(d){
    const dt = new Date(d);
    return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  }

  function startOfWeek(d){
    const dt = new Date(d);
    const day = dt.getDay(); // 0 = Sunday
    dt.setHours(0,0,0,0);
    dt.setDate(dt.getDate() - day);
    return dt;
  }

  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function toLocalInputValue(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fromLocalInputValue(val){
    const d = new Date(val);
    return isNaN(d.getTime()) ? null : d.toISOString();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- render: tag pills (shared by main + manual panel) ----------
  function renderTagPills(container, selected, disabled, onSelect){
    container.innerHTML = '';
    TAGS.forEach(tag => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tag' + (selected === tag.id ? ' selected' : '');
      btn.style.setProperty('--tag-color', tag.color);
      btn.textContent = tag.label;
      btn.disabled = !!disabled;
      btn.addEventListener('click', () => {
        if(disabled) return;
        onSelect(tag.id);
      });
      container.appendChild(btn);
    });
  }

  function renderTagRow(){
    renderTagPills(el.tagRow, selectedTag, false, (id) => {
      selectedTag = id;
      renderTagRow();
      renderGoState();
    });
  }

  function renderManualTagRow(){
    renderTagPills(el.manualTagRow, manualSelectedTag, false, (id) => {
      manualSelectedTag = id;
      renderManualTagRow();
    });
  }

  // ---------- render: start controls ----------
  function renderGoState(){
    el.goBtn.textContent = activeTimers.length > 0 ? 'Start another' : 'Start';
    el.goBtn.disabled = !selectedTag;
    el.hint.textContent = selectedTag ? '' : 'Pick a tag to start.';
  }

  // ---------- render: running panel ----------
  function renderRunningPanel(){
    if(activeTimers.length === 0){
      el.runningPanel.innerHTML = `
        <div class="idle-h">nothing running</div>
        <p class="idle-p">pick a tag below and go.</p>
      `;
      return;
    }

    const sorted = [...activeTimers].sort((a,b) => new Date(a.startISO) - new Date(b.startISO));
    let html = '';
    if(activeTimers.length > 1){
      html += `<div class="running-count">${activeTimers.length} timers running at once</div>`;
    }

    sorted.forEach(t => {
      const tag = TAG_MAP[t.tag];
      const elapsed = Date.now() - new Date(t.startISO).getTime();
      const taskText = t.task && t.task.trim() ? escapeHtml(t.task.trim()) : 'Untitled';
      const taskClass = t.task && t.task.trim() ? 'task' : 'task untitled';
      const editOpen = openEditId === t.id;

      html += `
        <div class="run-row" style="--tag-color:${tag.color}" data-id="${t.id}">
          <div class="clockrow">
            <div class="clock" data-role="clock" data-id="${t.id}" data-start="${t.startISO}">${fmtClock(elapsed)}</div>
            <div class="tagnow">${tag.label.toUpperCase()}</div>
          </div>
          <div class="${taskClass}">${taskText}</div>
          <div class="since-row">
            <span class="since">started ${fmtTimeOfDay(t.startISO)}</span>
            <button type="button" class="link-btn" data-action="toggleEdit" data-id="${t.id}">edit start</button>
            <button type="button" class="stop-btn" data-action="stop" data-id="${t.id}">Stop</button>
          </div>
          ${editOpen ? `
          <div class="edit-panel">
            <input type="datetime-local" data-role="editInput" data-id="${t.id}" value="${toLocalInputValue(t.startISO)}">
            <button type="button" class="link-btn" data-action="saveEdit" data-id="${t.id}">Save</button>
          </div>` : ''}
        </div>
      `;
    });

    el.runningPanel.innerHTML = html;
  }

  function tickClocks(){
    if(activeTimers.length === 0) return;
    const clocks = el.runningPanel.querySelectorAll('[data-role="clock"]');
    clocks.forEach(node => {
      const startISO = node.dataset.start;
      const elapsed = Date.now() - new Date(startISO).getTime();
      node.textContent = fmtClock(elapsed);
    });
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(tickClocks, 1000);
  }
  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  // ---------- render: tally ----------
  function entriesInRange(range){
    const now = new Date();
    if(range === 'all') return entries;
    if(range === 'today'){
      const key = dateKeyOf(now);
      return entries.filter(e => dateKeyOf(e.startISO) === key);
    }
    if(range === 'week'){
      const wkStart = startOfWeek(now).getTime();
      return entries.filter(e => new Date(e.startISO).getTime() >= wkStart);
    }
    return entries;
  }

  function renderTally(){
    const rows = entriesInRange(currentRange);
    const totals = {};
    TAGS.forEach(t => totals[t.id] = 0);
    let grandTotal = 0;
    rows.forEach(e => {
      totals[e.tag] = (totals[e.tag] || 0) + e.durationMs;
      grandTotal += e.durationMs;
    });

    el.tallyChart.innerHTML = '';
    if(grandTotal === 0){
      el.tallyChart.innerHTML = '<div class="tally-empty">Nothing logged yet for this range.</div>';
      el.tallyBaseline.style.display = 'none';
      el.tallyTotal.style.display = 'none';
      return;
    }
    el.tallyBaseline.style.display = 'block';

    const maxVal = Math.max(...TAGS.map(t => totals[t.id]));
    const MAX_PX = 80;
    TAGS.forEach(tag => {
      const val = totals[tag.id];
      if(val <= 0) return;
      const col = document.createElement('div');
      col.className = 'col';
      const heightPx = maxVal > 0 ? Math.max(6, Math.round((val/maxVal)*MAX_PX)) : 0;
      col.innerHTML = `
        <i class="bar" style="--tag-color:${tag.color}; height:${heightPx}px" title="${tag.label}: ${fmtHuman(val)}"></i>
        <span>${tag.short}</span>
      `;
      el.tallyChart.appendChild(col);
    });

    el.tallyTotal.style.display = 'flex';
    const rangeLabel = currentRange === 'today' ? 'today' : currentRange === 'week' ? 'this week' : 'all time';
    el.tallyTotal.innerHTML = `<span>${fmtHuman(grandTotal)} ${rangeLabel}</span><b>${fmtHuman(grandTotal)}</b>`;
  }

  // ---------- render: log ----------
  function renderLog(){
    if(entries.length === 0){
      el.logList.innerHTML = '<div class="empty-state">No entries yet. Start the timer above to log your first one.</div>';
      return;
    }
    const sorted = [...entries].sort((a,b) => new Date(b.startISO) - new Date(a.startISO));
    const groups = [];
    let lastKey = null;
    sorted.forEach(e => {
      const key = dateKeyOf(e.startISO);
      if(key !== lastKey){
        groups.push({ key, items: [] });
        lastKey = key;
      }
      groups[groups.length-1].items.push(e);
    });

    el.logList.innerHTML = '';
    groups.forEach(g => {
      const heading = document.createElement('div');
      heading.className = 'log-date-heading';
      heading.textContent = fmtDateHeading(g.key);
      el.logList.appendChild(heading);

      g.items.forEach(e => {
        const tag = TAG_MAP[e.tag] || TAGS[0];
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = e.id;
        const taskText = e.task && e.task.trim() ? escapeHtml(e.task.trim()) : 'Untitled';
        const taskClass = e.task && e.task.trim() ? 'n' : 'n untitled';
        row.innerHTML = `
          <span class="dot" style="--tag-color:${tag.color}"></span>
          <span class="t">${fmtTimeOfDay(e.startISO)}</span>
          <span class="${taskClass}">${taskText}</span>
          <span class="d">${fmtHuman(e.durationMs)}</span>
        `;
        el.logList.appendChild(row);

        if(openLogEditId === e.id){
          const panel = document.createElement('div');
          panel.className = 'log-edit-panel';
          panel.dataset.id = e.id;
          panel.innerHTML = `
            <input type="text" class="input" data-role="logEditTask" data-id="${e.id}" placeholder="what did you do?" value="${escapeHtml(e.task || '')}">
            <div class="tags" data-role="logEditTags" data-id="${e.id}"></div>
            <div class="time-field-row">
              <div class="time-field">
                <label>Start</label>
                <input type="datetime-local" data-role="logEditStart" data-id="${e.id}" value="${toLocalInputValue(e.startISO)}">
              </div>
              <div class="time-field">
                <label>End</label>
                <input type="datetime-local" data-role="logEditEnd" data-id="${e.id}" value="${toLocalInputValue(e.endISO)}">
              </div>
            </div>
            <div class="log-edit-actions">
              <button type="button" class="go" data-action="saveLogEdit" data-id="${e.id}">Save</button>
              <button type="button" class="link-btn danger-link" data-action="deleteLogEntry" data-id="${e.id}">Delete</button>
            </div>
            <div class="manual-error" data-role="logEditError" data-id="${e.id}"></div>
          `;
          el.logList.appendChild(panel);
          renderLogEditTags(e.id);
        }
      });
    });
  }

  function renderLogEditTags(entryId){
    const container = el.logList.querySelector(`[data-role="logEditTags"][data-id="${entryId}"]`);
    if(!container) return;
    renderTagPills(container, logEditTag, false, (id) => {
      logEditTag = id;
      renderLogEditTags(entryId);
    });
  }

  async function saveLogEdit(id){
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    const errorEl = el.logList.querySelector(`[data-role="logEditError"][data-id="${id}"]`);
    if(errorEl) errorEl.textContent = '';
    if(!logEditTag){
      if(errorEl) errorEl.textContent = 'Pick a tag.';
      return;
    }
    const taskInput = el.logList.querySelector(`input[data-role="logEditTask"][data-id="${id}"]`);
    const startInput = el.logList.querySelector(`input[data-role="logEditStart"][data-id="${id}"]`);
    const endInput = el.logList.querySelector(`input[data-role="logEditEnd"][data-id="${id}"]`);
    // datetime-local only has minute precision, so an untouched field can round-trip
    // to a value that collides with its neighbor on short (sub-minute) entries.
    // Only re-parse a field if it was actually changed — otherwise keep the exact
    // original timestamp so editing the task/tag alone can't break the duration.
    const startISO = startInput.value === toLocalInputValue(entry.startISO) ? entry.startISO : fromLocalInputValue(startInput.value);
    const endISO = endInput.value === toLocalInputValue(entry.endISO) ? entry.endISO : fromLocalInputValue(endInput.value);
    if(!startISO || !endISO){
      if(errorEl) errorEl.textContent = 'Add a start and end time.';
      return;
    }
    const durationMs = new Date(endISO).getTime() - new Date(startISO).getTime();
    if(durationMs <= 0){
      if(errorEl) errorEl.textContent = 'End time has to be after the start time.';
      return;
    }
    entry.task = taskInput.value || '';
    entry.tag = logEditTag;
    entry.startISO = startISO;
    entry.endISO = endISO;
    entry.durationMs = durationMs;
    await saveEntries();
    openLogEditId = null;
    renderAll();
  }

  async function deleteLogEntry(id){
    if(!confirm('Delete this entry?')) return;
    const idx = entries.findIndex(e => e.id === id);
    if(idx === -1) return;
    entries.splice(idx, 1);
    await saveEntries();
    openLogEditId = null;
    renderAll();
  }

  function renderAll(){
    renderTagRow();
    renderManualTagRow();
    renderGoState();
    renderRunningPanel();
    renderTally();
    renderLog();
  }

  // ---------- actions ----------
  async function handleGo(){
    if(!selectedTag) return;
    activeTimers.push({
      id: uid(),
      task: el.taskInput.value || '',
      tag: selectedTag,
      startISO: new Date().toISOString(),
    });
    el.taskInput.value = '';
    selectedTag = null;
    await saveActiveTimers();
    startTicking();
    renderAll();
  }

  async function stopTimer(id){
    const idx = activeTimers.findIndex(t => t.id === id);
    if(idx === -1) return;
    const t = activeTimers[idx];
    const endISO = new Date().toISOString();
    const durationMs = Date.now() - new Date(t.startISO).getTime();
    entries.push({
      id: uid(),
      task: t.task || '',
      tag: t.tag,
      startISO: t.startISO,
      endISO,
      durationMs: Math.max(0, durationMs),
    });
    activeTimers.splice(idx, 1);
    if(openEditId === id) openEditId = null;
    if(activeTimers.length === 0) stopTicking();
    await saveEntries();
    await saveActiveTimers();
    renderAll();
  }

  el.goBtn.addEventListener('click', handleGo);

  // ---- add a custom tag ----
  el.addTagToggle.addEventListener('click', () => {
    const isOpen = el.addTagPanel.classList.contains('open');
    if(isOpen){
      el.addTagPanel.classList.remove('open');
    }else{
      el.newTagName.value = '';
      el.addTagError.textContent = '';
      el.addTagPanel.classList.add('open');
      el.newTagName.focus();
    }
  });

  async function handleAddTag(){
    const name = el.newTagName.value;
    if(!name || !name.trim()){
      el.addTagError.textContent = 'Give it a name.';
      return;
    }
    const dup = TAGS.some(t => t.label.toLowerCase() === name.trim().toLowerCase());
    if(dup){
      el.addTagError.textContent = 'That tag already exists.';
      return;
    }
    addTag(name);
    await saveCustomTags();
    el.addTagPanel.classList.remove('open');
    renderAll();
  }

  el.addTagSaveBtn.addEventListener('click', handleAddTag);
  el.newTagName.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter') handleAddTag();
  });

  el.runningPanel.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-action]');
    if(!btn) return;
    const { action, id } = btn.dataset;

    if(action === 'stop'){
      await stopTimer(id);
      return;
    }

    if(action === 'toggleEdit'){
      openEditId = (openEditId === id) ? null : id;
      renderRunningPanel();
      return;
    }

    if(action === 'saveEdit'){
      const input = el.runningPanel.querySelector(`input[data-role="editInput"][data-id="${id}"]`);
      if(!input) return;
      const iso = fromLocalInputValue(input.value);
      if(!iso) return;
      if(new Date(iso).getTime() > Date.now()) return; // no future start times
      const t = activeTimers.find(x => x.id === id);
      if(t){
        t.startISO = iso;
        await saveActiveTimers();
      }
      openEditId = null;
      renderRunningPanel();
    }
  });

  el.logList.addEventListener('click', async (ev) => {
    const actionBtn = ev.target.closest('button[data-action]');
    if(actionBtn){
      const { action, id } = actionBtn.dataset;
      if(action === 'saveLogEdit') await saveLogEdit(id);
      else if(action === 'deleteLogEntry') await deleteLogEntry(id);
      return;
    }
    const row = ev.target.closest('.row[data-id]');
    if(row){
      const id = row.dataset.id;
      if(openLogEditId === id){
        openLogEditId = null;
      }else{
        openLogEditId = id;
        const entry = entries.find(e => e.id === id);
        logEditTag = entry ? entry.tag : null;
      }
      renderLog();
    }
  });

  el.rangeToggle.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-range]');
    if(!btn) return;
    currentRange = btn.dataset.range;
    [...el.rangeToggle.children].forEach(b => b.classList.toggle('active', b === btn));
    renderTally();
  });

  // ---- manual past entry ----
  function resetManualForm(){
    const now = new Date();
    const halfHourAgo = new Date(now.getTime() - 30*60000);
    el.manualTask.value = '';
    manualSelectedTag = null;
    el.manualStart.value = toLocalInputValue(halfHourAgo);
    el.manualEnd.value = toLocalInputValue(now);
    el.manualError.textContent = '';
    renderManualTagRow();
  }

  el.manualToggle.addEventListener('click', () => {
    const isOpen = el.manualPanel.classList.contains('open');
    if(isOpen){
      el.manualPanel.classList.remove('open');
      el.manualToggle.textContent = 'Missed it? Log a past entry';
    }else{
      resetManualForm();
      el.manualPanel.classList.add('open');
      el.manualToggle.textContent = 'Cancel past entry';
    }
  });

  el.manualSaveBtn.addEventListener('click', async () => {
    el.manualError.textContent = '';
    if(!manualSelectedTag){
      el.manualError.textContent = 'Pick a tag.';
      return;
    }
    const startISO = fromLocalInputValue(el.manualStart.value);
    const endISO = fromLocalInputValue(el.manualEnd.value);
    if(!startISO || !endISO){
      el.manualError.textContent = 'Add a start and end time.';
      return;
    }
    const durationMs = new Date(endISO).getTime() - new Date(startISO).getTime();
    if(durationMs <= 0){
      el.manualError.textContent = 'End time has to be after the start time.';
      return;
    }
    entries.push({
      id: uid(),
      task: el.manualTask.value || '',
      tag: manualSelectedTag,
      startISO,
      endISO,
      durationMs,
    });
    await saveEntries();
    el.manualPanel.classList.remove('open');
    el.manualToggle.textContent = 'Missed it? Log a past entry';
    renderAll();
  });

  // ---------- init ----------
  (async function init(){
    await loadAll();
    if(activeTimers.length > 0){
      startTicking();
    }
    renderAll();
    if(!storageOK){
      const note = document.createElement('div');
      note.className = 'storage-note';
      note.textContent = "Entries aren't saving right now — they'll only last this session.";
      document.querySelector('.screen').appendChild(note);
    }
  })();
})();
</script>
</body>
</html>
